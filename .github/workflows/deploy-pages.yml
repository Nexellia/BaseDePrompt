name: Mettre à jour la bibliothèque

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Préparer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Transformer le fichier Excel
        run: python scripts/xlsx_to_json.py "data/BibliothèquePrompt.xlsx" public/prompts.json

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Préparer le site
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v5
